name: Social sharing checks

on:
  pull_request:
    paths:
      - "src/**"
      - "scripts/check-ui-localization.ts"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - "next.config.ts"
      - "tests/**"
      - ".github/workflows/social-sharing-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  social-sharing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: UI localization coverage
        run: bun run quality:i18n
      - name: Product, localization, and social metadata tests
        run: bun run test
