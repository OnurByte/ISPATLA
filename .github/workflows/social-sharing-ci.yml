name: Social sharing checks

on:
  pull_request:
    paths:
      - "src/app/**"
      - "src/components/share-actions.tsx"
      - "src/components/hit-sharing-settings.tsx"
      - "src/lib/social-sharing.ts"
      - "src/server/og-fonts.ts"
      - "src/i18n/public-metadata.ts"
      - "tests/**"
      - ".github/workflows/social-sharing-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  social-sharing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Social metadata and image tests
        run: bun test tests/public-metadata.test.ts tests/social-sharing.test.ts tests/social-og-rendering.test.ts tests/og-rendering.test.ts
