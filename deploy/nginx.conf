# nginx vhost template for PANEL_HOST on the 67 box.
#
# Install:
#   1. htpasswd -bc /etc/nginx/htpasswd-panel <user> '<pass>'
#      chown root:www-data /etc/nginx/htpasswd-panel && chmod 640 it
#   2. Fill ISPATLA_ADMIN_TOKEN below with the same value pm2 uses
#      (ecosystem.config.cjs reads it from /root/.ispatla-admin-token).
#   3. cp deploy/nginx.conf /etc/nginx/sites-available/PANEL_HOST
#      ln -sf … /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#
# Two independent gates protect the panel:
#   * nginx basic auth — the reverse-proxy credential the README requires.
#   * `Authorization: Bearer <ISPATLA_ADMIN_TOKEN>` injected HERE, server-side,
#     because the app's own src/proxy.ts gate demands that header and a browser
#     cannot send it. Injecting it at the edge keeps the token out of the client
#     bundle, localStorage and the access log.
upstream ispatla_app {
    server 127.0.0.1:3500;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name PANEL_HOST;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name PANEL_HOST;

    ssl_certificate     /etc/letsencrypt/live/PANEL_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PANEL_HOST/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    location / {
        auth_basic "Ispatla";
        auth_basic_user_file /etc/nginx/htpasswd-panel;

        set $ispatla_token "ISPATLA_ADMIN_TOKEN";
        proxy_pass http://ispatla_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization "Bearer $ispatla_token";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
