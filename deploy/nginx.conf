# nginx vhost template for a single-node Ispatla panel deployment.
#
# Install:
#   1. Point the two values below at the real host and cert path.
#   2. cp deploy/nginx.conf /etc/nginx/sites-available/<host>
#      ln -sf … /etc/nginx/sites-enabled/
#      nginx -t && systemctl reload nginx
#   3. Obtain the certificate with certbot --webroot before switching to 443.
#
# Authentication is the application's own job: src/proxy.ts renders the sign-in
# screen for anonymous browsers, issues a signed session cookie, and redirects
# unauthenticated API calls to 401. The reverse proxy therefore does NOT inject
# an Authorization header and does NOT add a basic-auth layer — doing either
# would bypass the session lifecycle and break logout.
#
# Keep the admin token out of this file. It belongs in the process environment
# (ecosystem.config.cjs reads it from a root-only file) and is only needed by
# non-browser clients such as the automation worker and curl.
upstream ispatla_app {
    server 127.0.0.1:3500;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name PANEL_HOST;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name PANEL_HOST;

    ssl_certificate     /etc/letsencrypt/live/PANEL_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/PANEL_HOST/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 8m;

    location / {
        proxy_pass http://ispatla_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
